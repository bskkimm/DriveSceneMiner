[project]
name = "jevsceneminer"
version = "0.2.0"
description = "DriveSceneMiner: turn driving logs into timestamped maneuver labels."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "lanelet2>=1.2.3",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "numpy>=1.26",
    "pyproj>=3.7.1",
    "pyyaml>=6.0",
    "shapely>=2.1.2",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
jevsceneminer = "jevsceneminer.cli:main"

[project.urls]
Repository = "https://github.com/bskkimm/DriveSceneMiner"
Documentation = "https://github.com/bskkimm/DriveSceneMiner#readme"
Issues = "https://github.com/bskkimm/DriveSceneMiner/issues"

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevsceneminer"]

[tool.hatch.build.targets.wheel.force-include]
"configs/labels.yaml" = "jevsceneminer/labels.yaml"
"configs/labels.compact.yaml" = "jevsceneminer/labels.compact.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
